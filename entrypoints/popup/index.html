<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sentinel Autofill Bridge</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      width: 320px;
      background-color: #030712;
      color: #f3f4f6;
      padding: 16px;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 14px;
    }
    .icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: rgba(6, 182, 212, 0.15);
      border: 1px solid rgba(6, 182, 212, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #22d3ee;
    }
    .title {
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.2px;
    }
    .subtitle {
      font-size: 10px;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .status-card {
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 14px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }
    .dot.online {
      background-color: #34d399;
    }
    .dot.offline {
      background-color: #f87171;
    }
    .user-info {
      font-size: 12px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 4px;
      word-break: break-all;
    }
    .desc {
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.4;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 9px 12px;
      border-radius: 8px;
      border: none;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: background 0.15s ease;
    }
    .btn-primary {
      background-color: #06b6d4;
      color: #030712;
    }
    .btn-primary:hover {
      background-color: #22d3ee;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="icon">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
      </svg>
    </div>
    <div>
      <div class="title">Sentinel Autofill Bridge</div>
      <div class="subtitle">IAM Credential Relay</div>
    </div>
  </div>

  <div id="content">
    <div class="status-card">
      <div class="status-badge" style="color: #94a3b8;">
        <span>Checking Sentinel Session...</span>
      </div>
    </div>
  </div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
